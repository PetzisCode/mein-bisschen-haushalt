name: APK bauen

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK bauen
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk MeinBisschenHaushalt.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MeinBisschenHaushalt-APK
          path: MeinBisschenHaushalt.apk

      - name: Als Download-Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Mein bisschen Haushalt 1.0.${{ github.run_number }}
          body: |
            Zum Installieren auf dem Handy: unten auf **MeinBisschenHaushalt.apk** tippen,
            herunterladen und öffnen. Ggf. „Installation aus unbekannten Quellen“ erlauben.
          files: MeinBisschenHaushalt.apk
